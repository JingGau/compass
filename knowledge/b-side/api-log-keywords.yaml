# 接口到日志关键字映射
# 帮助 AI 在 SLS 中搜索相关日志时使用精准关键字

keywords:
  # ===== 钱包相关 =====
  - api_path: "/finance/wallet/balance"
    container: "finance-server"
    sls_keywords: ["getBalance", "walletQuery", "queryBalance"]
    error_keywords: ["WalletException", "BalanceQueryFail"]

  - api_path: "/finance/wallet/recharge"
    container: "finance-server"
    sls_keywords: ["rechargeOrder", "doRecharge", "walletRecharge"]
    error_keywords: ["RechargeException", "InsufficientBalance", "RechargeFail"]

  - api_path: "/finance/wallet/deduct"
    container: "finance-server"
    sls_keywords: ["walletDeduct", "deductBalance", "walletOperate"]
    error_keywords: ["DeductException", "InsufficientBalance"]

  - api_path: "/finance/wallet/batch-adjust"
    container: "finance-server"
    sls_keywords: ["batchAdjust", "walletAdjustRecord", "adjustBalance"]
    error_keywords: ["AdjustException", "BatchAdjustFail"]

  # ===== 充值相关 =====
  - api_path: "/finance/recharge/audit"
    container: "finance-server"
    sls_keywords: ["rechargeAudit", "auditRecharge"]
    error_keywords: ["AuditException", "RechargeAuditFail"]

  # ===== 发票相关 =====
  - api_path: "/finance/invoice/apply"
    container: "finance-server"
    sls_keywords: ["applyInvoice", "invoiceApply", "createInvoice"]
    error_keywords: ["InvoiceException", "InvoiceApplyFail", "TaxRateError"]

  # ===== 订单相关 =====
  - api_path: "/order/charging/list"
    container: "order-server"
    sls_keywords: ["queryOrder", "orderList", "chargingOrder"]
    error_keywords: ["OrderQueryException"]

  - api_path: "/order/charging/detail"
    container: "order-server"
    sls_keywords: ["orderDetail", "getOrderInfo"]
    error_keywords: ["OrderNotFoundException"]

  # ===== 支付相关（C端链路，B端也会查看） =====
  - api_path: "/payment/notify"
    container: "payment-server"
    sls_keywords: ["payNotify", "confirmPay", "payCallback"]
    error_keywords: ["PaymentException", "PayNotifyFail", "SignVerifyFail"]

  # ===== 充电相关（C端链路） =====
  - api_path: "/charge/start"
    container: "charge-server"
    sls_keywords: ["startCharge", "chargeStart", "beginCharge"]
    error_keywords: ["ChargeStartFail", "PileOffline", "ChargeException"]

  - api_path: "/charge/stop"
    container: "charge-server"
    sls_keywords: ["stopCharge", "chargeStop", "endCharge"]
    error_keywords: ["ChargeStopFail", "ForceStop"]

# 注意：以上关键字为业务推断，准确关键字需扫描后端 Service 代码中的 log 语句
