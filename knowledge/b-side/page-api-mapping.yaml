# B端页面到接口映射
# 记录每个页面调用了哪些后端接口，用于排查时追溯链路

mappings:
  - page_id: "wallet-management"
    apis:
      - method: "GET"
        path: "/finance/wallet/balance"
        service: "finance_server"
        description: "查询钱包余额"
      - method: "POST"
        path: "/finance/wallet/recharge"
        service: "finance_server"
        description: "钱包充值"
      - method: "POST"
        path: "/finance/wallet/deduct"
        service: "finance_server"
        description: "钱包扣款"
      - method: "POST"
        path: "/finance/wallet/batch-adjust"
        service: "finance_server"
        description: "批量额度调整"

  - page_id: "fleet-management"
    apis:
      - method: "GET"
        path: "/base/fleet/list"
        service: "base_server"
        description: "车队列表"
      - method: "POST"
        path: "/base/fleet/create"
        service: "base_server"
        description: "创建车队"
      - method: "GET"
        path: "/base/driver/list"
        service: "base_server"
        description: "司机列表"

  - page_id: "recharge-management"
    apis:
      - method: "GET"
        path: "/finance/recharge/list"
        service: "finance_server"
        description: "充值记录列表"
      - method: "POST"
        path: "/finance/recharge/audit"
        service: "finance_server"
        description: "充值审核"

  - page_id: "invoice-management"
    apis:
      - method: "GET"
        path: "/finance/invoice/list"
        service: "finance_server"
        description: "发票列表"
      - method: "POST"
        path: "/finance/invoice/apply"
        service: "finance_server"
        description: "申请开票"

  - page_id: "order-list"
    apis:
      - method: "GET"
        path: "/order/charging/list"
        service: "order-server"
        description: "充电订单列表"
      - method: "GET"
        path: "/order/charging/detail"
        service: "order-server"
        description: "订单详情"

  - page_id: "station-management"
    apis:
      - method: "GET"
        path: "/base/station/list"
        service: "base_server"
        description: "电站列表"
      - method: "GET"
        path: "/base/pile/list"
        service: "base_server"
        description: "充电桩列表"

  - page_id: "price-management"
    apis:
      - method: "GET"
        path: "/price/template/list"
        service: "price_center_server"
        description: "价格模板列表"

# 注意：以上接口路径为业务推断，准确数据需扫描 omp-shop/src/api/ 获取
