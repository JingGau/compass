  unionpay_acquire_server: FINANCE/unionpay_acquire_server
  cncb-emanager-server: FINANCE/cncb-emanager-server
  ct_finance_server: FINANCE/ct_finance_server

  base_server: omp/base_server
  activity_server: omp/activity_server
