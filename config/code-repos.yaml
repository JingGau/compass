  status-server: omp/status-server
  event_tracing_server: omp/event_tracing_server
  foundation: omp/foundation
  foundation-c: omp/foundation-c

  charge-server: TRADE/charge-server
  charge-business-server: TRADE/charge-business-server
  flow-charge-server: TRADE/flow-charge-server
  trade-order-server: TRADE/trade-order-server
  trade-sync-server: TRADE/trade-sync-server
