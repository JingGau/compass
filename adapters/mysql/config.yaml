enabled: true

profiles:
  - name: "polardb-test"
    env: "test"
    host: "${MYSQL_POLARDB_TEST_HOST}"
    port: "${MYSQL_POLARDB_TEST_PORT:-3306}"
    user: "${MYSQL_POLARDB_TEST_USER}"
    password: "${MYSQL_POLARDB_TEST_PASSWORD}"
    database: "yunkc_finance"
    description: "测试环境 PolarDB 财务库(yunkc_finance)"

  - name: "polardb-uat"
    env: "uat"
    host: "${MYSQL_POLARDB_UAT_HOST}"
    port: "${MYSQL_POLARDB_UAT_PORT:-3306}"
    user: "${MYSQL_POLARDB_UAT_USER}"
    password: "${MYSQL_POLARDB_UAT_PASSWORD}"
    database: "yunkc_finance"
    description: "UAT环境 PolarDB 财务库(yunkc_finance)"

  - name: "main-test"
    env: "test"
    host: "${MYSQL_MAIN_TEST_HOST}"
    port: "${MYSQL_MAIN_TEST_PORT:-3306}"
    user: "${MYSQL_MAIN_TEST_USER}"
    password: "${MYSQL_MAIN_TEST_PASSWORD}"
    database: "yunkc_base"
    description: "测试环境 主库(yunkc_base)"

  - name: "main-uat"
    env: "uat"
    host: "${MYSQL_MAIN_UAT_HOST}"
    port: "${MYSQL_MAIN_UAT_PORT:-3306}"
    user: "${MYSQL_MAIN_UAT_USER}"
    password: "${MYSQL_MAIN_UAT_PASSWORD}"
    database: "yunkc_base"
    description: "UAT环境 主库(yunkc_base)"

default_profile: "polardb-test"
