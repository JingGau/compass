enabled: true

profiles:
  - name: "finance-test"
    env: "test"
    mode: "standalone"
    host: "${REDIS_FINANCE_TEST_HOST}"
    port: "${REDIS_FINANCE_TEST_PORT:-6379}"
    password: "${REDIS_FINANCE_TEST_PASSWORD}"
    db: "${REDIS_FINANCE_TEST_DB:-30}"
    description: "测试环境 财务Redis db30"

  - name: "finance-uat"
    env: "uat"
    mode: "standalone"
    host: "${REDIS_FINANCE_UAT_HOST}"
    port: "${REDIS_FINANCE_UAT_PORT:-6379}"
    password: "${REDIS_FINANCE_UAT_PASSWORD}"
    db: "${REDIS_FINANCE_UAT_DB:-30}"
    description: "UAT环境 财务Redis db30"

  - name: "activity-test"
    env: "test"
    mode: "standalone"
    host: "${REDIS_ACTIVITY_TEST_HOST}"
    port: "${REDIS_ACTIVITY_TEST_PORT:-6379}"
    password: "${REDIS_ACTIVITY_TEST_PASSWORD}"
    db: "${REDIS_ACTIVITY_TEST_DB:-10}"
    description: "测试环境 活动Redis db10"

  - name: "activity-uat"
    env: "uat"
    mode: "standalone"
    host: "${REDIS_ACTIVITY_UAT_HOST}"
    port: "${REDIS_ACTIVITY_UAT_PORT:-6379}"
    password: "${REDIS_ACTIVITY_UAT_PASSWORD}"
    db: "${REDIS_ACTIVITY_UAT_DB:-10}"
    description: "UAT环境 活动Redis db10"

  - name: "price-test"
    env: "test"
    mode: "standalone"
    host: "${REDIS_PRICE_TEST_HOST}"
    port: "${REDIS_PRICE_TEST_PORT:-6379}"
    password: "${REDIS_PRICE_TEST_PASSWORD}"
    db: "${REDIS_PRICE_TEST_DB:-10}"
    description: "测试环境 价格Redis db10"

  - name: "price-uat"
    env: "uat"
    mode: "standalone"
    host: "${REDIS_PRICE_UAT_HOST}"
    port: "${REDIS_PRICE_UAT_PORT:-6379}"
    password: "${REDIS_PRICE_UAT_PASSWORD}"
    db: "${REDIS_PRICE_UAT_DB:-12}"
    description: "UAT环境 价格Redis db12"

  - name: "redis2-test"
    env: "test"
    mode: "standalone"
    host: "${REDIS_REDIS2_TEST_HOST}"
    port: "${REDIS_REDIS2_TEST_PORT:-6379}"
    password: "${REDIS_REDIS2_TEST_PASSWORD}"
    db: "${REDIS_REDIS2_TEST_DB:-0}"
    description: "测试环境 Redis2 db0"

default_profile: "finance-test"
