# 查询策略库
# 每次成功排查后 AI 自动归档为策略，逐步积累经验
# 策略不是固定模板，是"学来的经验" —— AI 基于全部上下文动态匹配和演化
#
# 管理规则：
#   - 同 category 下策略数 > 5 → 提醒合并同类策略
#   - 总数 > 50 → 提醒淘汰低效策略
#   - effectiveness < 0.3 或 180 天未使用 → 建议归档到 archived-strategies.yaml
#   - 被频繁微调的策略 → 提示进化更新

# ============================================================
# 策略结构定义
# ============================================================
#
# 每条策略包含四个部分：
#
# 1. pattern  — 什么问题（用于匹配）
#    category:     问题分类（与 categories.yaml 对应）
#    keywords:     触发关键词列表
#    entity_types: 需要哪些实体类型
#    services:     涉及的后端服务
#    scene:        c-side / b-side
#
# 2. plan     — 怎么查（查询路径）
#    每个 step 包含：
#    - adapter:       使用哪个 adapter
#    - action:        一句话说明
#    - template:      查询模板（含 {entity} 占位符）
#    - env_profile:   目标环境/profile（如 prod, finance_prod）
#    - source:        来自哪段代码（如有）
#    - parallel_with: 可与哪个 step 并行（null 表示独立）
#    - depends_on:    依赖哪个 step 的结果（null 表示无依赖）
#
# 3. score    — 效果（用于排序）
#    effectiveness:  成功定位问题的比率 (0.0 ~ 1.0)
#    usage_count:    被采用次数
#    last_used:      最近使用日期
#    avg_rounds:     平均几轮查到原因
#    user_ratings:   用户评分历史 (1~5)
#    modification_count: 用户微调次数（高说明需要进化）
#
# 4. meta     — 来源信息
#    created_at:     创建日期
#    created_from:   来源（first_use / merged / optimized / preset）
#    last_updated:   最近更新日期
#    related_projects: 关联的 projects/*.md（哪些代码路径帮助了定位）
#    pinned:         是否被用户标记为不可删除（true/false）
#
# ============================================================

# 匹配权重配置
matching_weights:
  category: 0.30       # 问题分类匹配度
  keywords: 0.20       # 关键字命中率
  entity_types: 0.10   # 实体类型覆盖度
  services: 0.15       # 涉及服务匹配度
  effectiveness: 0.15  # 历史成功率
  recency: 0.10        # 时间衰减因子（越近权重越高）

# 管理阈值
limits:
  max_total: 50                  # 策略总数上限，超过自动淘汰
  max_per_category: 5            # 同分类下上限，超过自动合并
  min_effectiveness: 0.3         # 低于此值自动归档
  stale_days: 180                # 超过此天数未使用自动归档
  evolution_trigger: 3           # 微调次数达到此值时自动进化
  recent_use_protection: 5       # 最近 N 次排查使用过的策略不可触碰

# 策略列表
strategies:
  # 2026-03-28 会话沉淀：线上仅 SLS + 平台 Doris 可用时的「挪桩溯源」路径（用户确认）
  - id: "strategy_move_pile_trace_prod_sls_platform_20260328"
    pattern:
      category: "B端-挪桩/电站迁移溯源"
      keywords:
        - "挪桩"
        - "移桩"
        - "从哪个电站"
        - "移入"
        - "pile_code"
        - "320106"
        - "moveStationPiles"
        - "move_pile_operate_record"
      entity_types: ["pile_code", "station_name", "station_id", "time_range"]
      services: ["base_server", "poly_server"]
      scene: "b-side"
    plan:
      - step: 1
        adapter: "sls"
        action: "【规划前对齐代码】omp-shop：api.js 中 URL_ADDPILECOPY（/pile/addPileCopy）、URL_MOVEPILEPAGELIST；base_server：PileController#addPileCopy→webMovePile、PileFeign /rpc/pile/move、PileService#moveStationPiles（日志含 moveStationPiles param/success/error 与 MovePileBo）。再在本步查生产 SLS：关键字 pile_code 或 moveStationPiles，从日志中的 targetStationId/sourceStationId 定迁移方向。"
        template: "{pile_code} OR moveStationPiles OR MovePileBo"
        env_profile: "prod"
        source: "projects/omp-shop.md、projects/base_server.md；PileService.java、PileRpcController.java、api.js"
        parallel_with: null
        depends_on: null
      - step: 2
        adapter: "platform"
        action: "Doris 印证站名与辅助流水：ods_base_s_t_charging_station 按 id 解析站名；ods_move_pile_operate_record 按 target_pile_code 或站 id 查询（CDC 可能不全，无行时以 SLS 为准）。"
        template: "SELECT station_id, station_name FROM ods_base_cdc.ods_base_s_t_charging_station WHERE station_id IN ({source_station_id},{target_station_id}); SELECT * FROM ods_base_cdc.ods_move_pile_operate_record WHERE target_pile_code = '{pile_code}' ORDER BY create_time DESC LIMIT 20"
        env_profile: "prod"
        source: "MovePileOperateRecordMapper.xml → move_pile_operate_record"
        parallel_with: null
        depends_on: 1
      - step: 3
        adapter: "platform"
        action: "可选：ods_base_s_t_charging_pile 按 pile_code 查 station_belong_to 与桩名，与日志时间窗对照（快照可能与迁桩瞬间不一致）。"
        template: "SELECT pile_id, pile_code, pile_name, station_belong_to, update_time FROM ods_base_cdc.ods_base_s_t_charging_pile WHERE pile_code = '{pile_code}' LIMIT 5"
        env_profile: "prod"
        source: "ods_base_cdc.ods_base_s_t_charging_pile"
        parallel_with: null
        depends_on: 1
    score:
      effectiveness: 0.85
      usage_count: 1
      last_used: "2026-03-28"
      avg_rounds: 1.0
      user_ratings: []
      modification_count: 0
    meta:
      created_at: "2026-03-28"
      created_from: "user_session"
      last_updated: "2026-03-28"
      related_projects: ["omp-shop", "base_server"]
      pinned: false
      notes: "罗盘合规提醒：执行前须输出查询方案表（含 [adapter→prod]）并经用户确认；平台 SQL 走 sql-safety；结果脱敏；若仅 SLS+Doris 可用则不在方案中写 MySQL。实际迁桩日志可能落在 OMP-POLY-CENTER 等容器，需用 pile_code/moveStationPiles 检索而非只盯 base-server。"

